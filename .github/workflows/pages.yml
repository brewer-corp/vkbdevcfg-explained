# Publishes site/ to GitHub Pages. The site is static: no build step.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["site/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skips cleanly until Pages is switched on for the repository (Settings > Pages > Source: GitHub Actions).
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The config tool is built from app/ and served under /app/.
      - name: Build the config tool
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
          cp -r dist ../site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
